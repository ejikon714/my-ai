<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>自作画像認識AI</title>

  <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@4.22.0"></script>
  <script src="https://cdn.jsdelivr.net/npm/@teachablemachine/image@0.8/dist/teachablemachine-image.min.js"></script>

  <style>
    body {
      font-family: sans-serif;
      text-align: center;
      margin: 0;
      padding: 30px 15px;
      background: #f5f5f5;
    }

    h1 {
      margin-bottom: 20px;
    }

    #webcam-container {
      margin: 20px auto;
    }

    #webcam {
      width: 300px;
      height: 300px;
      object-fit: cover;
      border-radius: 10px;
    }

    #label-container {
      font-size: 20px;
      font-weight: bold;
      margin-top: 20px;
    }

    button {
      font-size: 18px;
      padding: 12px 20px;
      margin: 5px;
      border: none;
      border-radius: 10px;
      cursor: pointer;
    }

    #switch-button {
      display: none;
    }
  </style>
</head>

<body>

  <h1>自作画像認識AI</h1>

  <button type="button" onclick="init()">カメラを起動</button>

  <button
    type="button"
    id="switch-button"
    onclick="switchCamera()">
    カメラを切り替え
  </button>

  <div id="webcam-container"></div>

  <div id="label-container"></div>

  <script>
    const URL = "./";

    let model;
    let video;
    let labelContainer;
    let maxPredictions;
    let stream;

    // 最初は背面カメラ
    let facingMode = "environment";

    async function init() {

      const modelURL = URL + "model.json";
      const metadataURL = URL + "metadata.json";

      model = await tmImage.load(
        modelURL,
        metadataURL
      );

      maxPredictions = model.getTotalClasses();

      video = document.createElement("video");

      video.id = "webcam";
      video.autoplay = true;
      video.playsInline = true;

      document
        .getElementById("webcam-container")
        .appendChild(video);

      labelContainer =
        document.getElementById("label-container");

      for (let i = 0; i < maxPredictions; i++) {

        labelContainer.appendChild(
          document.createElement("div")
        );
      }

      await startCamera();

      document.getElementById(
        "switch-button"
      ).style.display = "inline-block";
    }

    async function startCamera() {

      // 以前のカメラを停止
      if (stream) {

        stream.getTracks().forEach(
          track => track.stop()
        );
      }

      const constraints = {

        video: {
          facingMode: {
            ideal: facingMode
          },
          width: {
            ideal: 300
          },
          height: {
            ideal: 300
          }
        },

        audio: false
      };

      try {

        stream =
          await navigator.mediaDevices
            .getUserMedia(constraints);

        video.srcObject = stream;

        await video.play();

      } catch (error) {

        console.error(error);

        alert(
          "カメラを起動できませんでした。カメラの使用を許可してください。"
        );

        return;
      }

      window.requestAnimationFrame(loop);
    }

    async function switchCamera() {

      // 前後を切り替える
      if (facingMode === "environment") {

        facingMode = "user";

      } else {

        facingMode = "environment";
      }

      await startCamera();
    }

    async function loop() {

      if (
        video &&
        video.readyState >= 2
      ) {

        await predict();
      }

      window.requestAnimationFrame(loop);
    }

    async function predict() {

      const prediction =
        await model.predict(video);

      for (
        let i = 0;
        i < maxPredictions;
        i++
      ) {

        const className =
          prediction[i].className;

        const probability =
          (
            prediction[i].probability * 100
          ).toFixed(1);

        labelContainer
          .childNodes[i]
          .innerHTML =
            className +
            "：" +
            probability +
            "%";
      }
    }
  </script>

</body>
</html>
