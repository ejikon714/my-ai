<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <script src="https://cdn.jsdelivr.net/npm/@teachablemachine/image@0.8/dist/teachablemachine-image.min.js"></script>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;

      width: 100%;

    .result-card {

</head>

<body>

  <div class="app">

    <div class="header">
      <h1>画像認識AI</h1>

      <div class="subtitle">
        カメラで画像を認識します
      </div>
    </div>


    <div class="camera-card">

      <div id="webcam-container">

        <div class="camera-message">
          カメラを起動してください
        </div>

      </div>


      <div class="buttons">

        <button
          id="start-button"
          type="button"
          onclick="init()">
          カメラを起動
        </button>


        <button
          id="switch-button"
          type="button"
          onclick="switchCamera()">
          カメラを切り替え
        </button>


        <button
          id="stop-button"
          type="button"
          onclick="stopCamera()">
          カメラをオフ
        </button>

      </div>

    </div>


    <div class="result-card">

      <div class="result-title">
        認識結果
      </div>

      <div id="label-container"></div>

    </div>


    <div class="footer">
      Image Recognition AI
    </div>

  </div>


  <script>

    const URL = "./";

    let model;
    let video;
    let stream = null;

    let labelContainer;
    let maxPredictions;

    // 最初は背面カメラ
    let facingMode = "environment";

    // カメラが動いているか
    let cameraActive = false;


    // =========================
    // カメラ起動
    // =========================

    async function init() {

      // AIモデルをまだ読み込んでいない場合だけ読み込む
      if (!model) {

        const modelURL =
          URL + "model.json";

        const metadataURL =
          URL + "metadata.json";

        model = await tmImage.load(
          modelURL,
          metadataURL
        );

        maxPredictions =
          model.getTotalClasses();

      }


      // videoを作成
      video =
        document.createElement("video");

      video.id = "webcam";

      video.autoplay = true;
      video.playsInline = true;
      video.muted = true;


      const container =
        document.getElementById(
          "webcam-container"
        );


      container.innerHTML = "";

      container.appendChild(video);


      // 認識結果欄
      labelContainer =
        document.getElementById(
          "label-container"
        );


      labelContainer.innerHTML = "";


      for (
        let i = 0;
        i < maxPredictions;
        i++
      ) {

        labelContainer.appendChild(
          document.createElement("div")
        );

      }


      // カメラ開始
      await startCamera();


      if (!cameraActive) {
        return;
      }


      // ボタン表示
      document.getElementById(
        "start-button"
      ).style.display = "none";


      document.getElementById(
        "switch-button"
      ).style.display = "block";


      document.getElementById(
        "stop-button"
      ).style.display = "block";


      cameraActive = true;


      // AI認識開始
      window.requestAnimationFrame(loop);

    }


    // =========================
    // カメラ開始
    // =========================

    async function startCamera() {

      // すでにカメラが動いていたら停止
      if (stream) {

        stream
          .getTracks()
          .forEach(
            track => track.stop()
          );

        stream = null;

      }


      const constraints = {

        video: {

          facingMode:
            facingMode,

          width: {
            ideal: 640
          },

          height: {
            ideal: 480
          }

        },

        audio: false

      };


      try {

        stream =
          await navigator
            .mediaDevices
            .getUserMedia(
              constraints
            );


        video.srcObject =
          stream;


        await video.play();


        cameraActive = true;


      } catch (error) {

        console.error(error);


        cameraActive = false;


        alert(
          "カメラを起動できませんでした。カメラの使用を許可してください。"
        );

      }

    }


    // =========================
    // カメラ切り替え
    // =========================

    async function switchCamera() {

      if (!cameraActive) {
        return;
      }


      if (
        facingMode ===
        "environment"
      ) {

        facingMode = "user";

      } else {

        facingMode =
          "environment";

      }


      await startCamera();

    }


    // =========================
    // カメラOFF
    // =========================

    function stopCamera() {

      // カメラ停止
      if (stream) {

        stream
          .getTracks()
          .forEach(
            track => track.stop()
          );

        stream = null;

      }


      cameraActive = false;


      // カメラ映像を削除
      const container =
        document.getElementById(
          "webcam-container"
        );


      container.innerHTML = `

        <div class="camera-message">
          カメラはオフです
        </div>

      `;


      // ボタンを戻す
      document.getElementById(
        "start-button"
      ).style.display = "block";


      document.getElementById(
        "start-button"
      ).textContent =
        "カメラを起動";


      document.getElementById(
        "switch-button"
      ).style.display = "none";


      document.getElementById(
        "stop-button"
      ).style.display = "none";


      // 認識結果を消す
      if (labelContainer) {

        labelContainer.innerHTML = "";

      }

    }


    // =========================
    // AI認識ループ
    // =========================

    async function loop() {

      if (
        cameraActive &&
        video &&
        video.readyState >= 2 &&
        model
      ) {

        await predict();

      }


      // カメラがONのときだけ続ける
      if (cameraActive) {

        window.requestAnimationFrame(
          loop
        );

      }

    }


    // =========================
    // AI予測
    // =========================

    async function predict() {

      if (
        !cameraActive ||
        !video ||
        !model
      ) {

        return;

      }


      try {

        const prediction =
          await model.predict(
            video
          );


        for (
          let i = 0;
          i < maxPredictions;
          i++
        ) {

          const className =
            prediction[i]
              .className;


          const probability =
            (
              prediction[i]
                .probability *
              100
            ).toFixed(1);


          if (
            labelContainer &&
            labelContainer.childNodes[i]
          ) {

            labelContainer
              .childNodes[i]
              .innerHTML =
                className +
                "　" +
                probability +
                "%";

          }

        }

      } catch (error) {

        console.error(error);

      }

    }

  </script>

</body>
</html>
