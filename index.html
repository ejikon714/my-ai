<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<meta
  http-equiv="Content-Security-Policy"
  content="
    default-src 'self';
    script-src 'self';
    style-src 'self' 'unsafe-inline';
    img-src 'self' blob: data:;
    media-src 'self' blob:;
    connect-src 'self';
    worker-src 'self';
    object-src 'none';
    base-uri 'self';
    form-action 'none';
  "
>

<title>画像認識AI</title>

<script src="./tf.min.js"></script>
<script src="./teachablemachine-image.min.js"></script>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  min-height: 100vh;
  font-family:
    -apple-system,
    BlinkMacSystemFont,
    "Segoe UI",
    sans-serif;
  background: linear-gradient(135deg,#eef2ff,#f8fafc);
  color: #1e293b;
}

.app {
  width: 100%;
  max-width: 480px;
  margin: auto;
  padding: 28px 16px 35px;
}

.header {
  text-align: center;
  margin-bottom: 22px;
}

h1 {
  margin: 0;
  font-size: 30px;
  font-weight: 800;
}

.subtitle {
  margin-top: 7px;
  color: #64748b;
  font-size: 14px;
}

.card {
  background: white;
  border-radius: 24px;
  padding: 15px;
  box-shadow: 0 12px 35px rgba(0,0,0,.10);
  margin-bottom: 18px;
}

#webcam-container {
  width: 100%;
  aspect-ratio: 1 / 1;
  background: #0f172a;
  border-radius: 18px;
  overflow: hidden;
  display: flex;
  align-items: center;
  justify-content: center;
}

#webcam {
  width: 100%;
  height: 100%;
  object-fit: cover;
  transform-origin: center;
  transition: transform .15s ease;
}

.camera-message {
  color: #94a3b8;
  font-size: 14px;
  text-align: center;
}

.buttons {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 8px;
  margin-top: 14px;
}

button {
  border: none;
  padding: 14px 8px;
  border-radius: 14px;
  font-size: 14px;
  font-weight: 700;
  cursor: pointer;
}

#start-button {
  grid-column: 1 / -1;
  background: #2563eb;
  color: white;
}

#switch-button {
  display: none;
  background: #e2e8f0;
}

#stop-button {
  display: none;
  background: #ef4444;
  color: white;
}

#capture-button {
  display: none;
  grid-column: 1 / -1;
  background: #16a34a;
  color: white;
  font-size: 16px;
}

#zoom-controls {
  display: none;
  margin-top: 17px;
}

.zoom-title {
  text-align: center;
  color: #64748b;
  font-size: 13px;
  margin-bottom: 8px;
}

.zoom-buttons {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 16px;
}

.zoom-button {
  width: 55px;
  height: 48px;
  padding: 0;
  background: #e2e8f0;
  font-size: 24px;
}

#zoom-value {
  min-width: 65px;
  text-align: center;
  font-size: 18px;
  font-weight: 800;
}

#photo-area {
  display: none;
  margin-top: 18px;
}

#captured-photo {
  width: 100%;
  display: block;
  border-radius: 16px;
}

.photo-buttons {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 8px;
  margin-top: 10px;
}

#download-button {
  background: #7c3aed;
  color: white;
}

#delete-photo-button {
  background: #dc2626;
  color: white;
}

#image-input {
  display: none;
}

#load-image-button {
  width: 100%;
  margin-top: 10px;
  background: #0f766e;
  color: white;
}

.privacy {
  margin-top: 12px;
  padding: 11px;
  border-radius: 12px;
  background: #f0fdf4;
  color: #166534;
  font-size: 12px;
  text-align: center;
  line-height: 1.5;
}

.result-title {
  font-size: 18px;
  font-weight: 800;
  margin-bottom: 14px;
}

#highest-result {
  display: none;
  background: #eff6ff;
  border-radius: 18px;
  padding: 17px;
  margin-bottom: 18px;
  text-align: center;
}

.highest-label {
  color: #64748b;
  font-size: 12px;
}

#highest-name {
  font-size: 24px;
  font-weight: 800;
  margin: 5px 0;
}

#highest-percent {
  color: #2563eb;
  font-size: 19px;
  font-weight: 800;
}

.result-item {
  margin-bottom: 15px;
}

.result-header {
  display: flex;
  justify-content: space-between;
  margin-bottom: 7px;
}

.result-name,
.result-percent {
  font-weight: 700;
}

.bar-background {
  width: 100%;
  height: 13px;
  background: #e2e8f0;
  border-radius: 999px;
  overflow: hidden;
}

.bar {
  width: 0%;
  height: 100%;
  background: #2563eb;
  border-radius: 999px;
  transition: width .2s ease;
}

.status {
  text-align: center;
  margin-top: 12px;
  font-size: 12px;
  color: #64748b;
}

.footer {
  text-align: center;
  margin-top: 20px;
  color: #94a3b8;
  font-size: 12px;
}
</style>
</head>

<body>

<div class="app">

<div class="header">
<h1>画像認識AI</h1>
<div class="subtitle">
カメラや画像からAIが認識します
</div>
</div>

<div class="card">

<div id="webcam-container">
<div class="camera-message">
カメラを起動してください
</div>
</div>

<div class="buttons">

<button id="start-button" type="button">
📷 カメラを起動
</button>

<button id="switch-button" type="button">
🔄 カメラ切り替え
</button>

<button id="stop-button" type="button">
⛔ カメラOFF
</button>

<button id="capture-button" type="button">
📸 写真を撮影
</button>

</div>

<div id="zoom-controls">

<div class="zoom-title">
デジタルズーム
</div>

<div class="zoom-buttons">

<button class="zoom-button" id="zoom-minus">
−
</button>

<div id="zoom-value">1.0×</div>

<button class="zoom-button" id="zoom-plus">
＋
</button>

</div>

</div>

<div id="photo-area">

<img id="captured-photo" alt="撮影・読み込み画像">

<div class="photo-buttons">

<button id="download-button">
💾 写真を保存
</button>

<button id="delete-photo-button">
🗑️ 写真を削除
</button>

</div>

<div class="privacy">
🔒 プライバシー保護<br>
カメラ映像・写真は外部サーバーへ送信せず、
この端末内でAI判定します。
</div>

</div>

<input
id="image-input"
type="file"
accept="image/*"
>

<button id="load-image-button">
🖼️ 画像を読み込んで認識
</button>

<div id="status" class="status">
AIモデル未起動
</div>

</div>

<div class="card">

<div class="result-title">
認識結果
</div>

<div id="highest-result">

<div class="highest-label">
最も高い認識結果
</div>

<div id="highest-name"></div>

<div id="highest-percent"></div>

</div>

<div id="label-container"></div>

</div>

<div class="footer">
Image Recognition AI
</div>

</div>

<script>

"use strict";

/*
 * ==========================================
 * プライバシー・安全設計
 * ==========================================
 *
 * 画像を外部へ送信する処理を実装しない。
 *
 * fetch()
 * XMLHttpRequest
 * navigator.sendBeacon()
 *
 * などによる画像アップロードは行わない。
 *
 * AI判定は model.predict() により端末内で実行。
 */

const MODEL_URL = "../model.json";
const METADATA_URL = "../metadata.json";

let model = null;
let video = null;
let stream = null;

let labelContainer = null;
let maxPredictions = 0;

let cameraActive = false;
let facingMode = "environment";

let currentZoom = 1.0;

const MIN_ZOOM = 1.0;
const MAX_ZOOM = 3.0;

const PREDICTION_INTERVAL = 120;

let lastPredictionTime = 0;

let capturedDataURL = null;


/*
 * ==========================================
 * Service Worker
 * ==========================================
 */

if ("serviceWorker" in navigator) {

  window.addEventListener("load", () => {

    navigator.serviceWorker
      .register("./sw.js")
      .catch(error => {

        console.error(
          "Service Worker:",
          error
        );

      });

  });

}


/*
 * ==========================================
 * AIモデル
 * ==========================================
 */

async function loadModel() {

  if (model) {
    return;
  }

  setStatus(
    "AIモデルを読み込んでいます..."
  );

  model = await tmImage.load(
    MODEL_URL,
    METADATA_URL
  );

  maxPredictions =
    model.getTotalClasses();

  createResultArea();

  setStatus(
    "AIモデル準備完了"
  );
}


/*
 * ==========================================
 * 結果欄
 * ==========================================
 */

function createResultArea() {

  labelContainer =
    document.getElementById(
      "label-container"
    );

  labelContainer.innerHTML = "";

  for (
    let i = 0;
    i < maxPredictions;
    i++
  ) {

    const item =
      document.createElement("div");

    item.className =
      "result-item";

    item.innerHTML = `
      <div class="result-header">
        <span class="result-name"></span>
        <span class="result-percent"></span>
      </div>

      <div class="bar-background">
        <div class="bar"></div>
      </div>
    `;

    labelContainer.appendChild(item);
  }
}


/*
 * ==========================================
 * カメラ起動
 * ==========================================
 */

async function init() {

  try {

    await loadModel();

    video =
      document.createElement("video");

    video.id = "webcam";
    video.autoplay = true;
    video.playsInline = true;
    video.muted = true;

    const container =
      document.getElementById(
        "webcam-container"
      );

    container.innerHTML = "";
    container.appendChild(video);

    await startCamera();

    if (!cameraActive) {
      return;
    }

    document.getElementById(
      "start-button"
    ).style.display = "none";

    document.getElementById(
      "switch-button"
    ).style.display = "block";

    document.getElementById(
      "stop-button"
    ).style.display = "block";

    document.getElementById(
      "capture-button"
    ).style.display = "block";

    document.getElementById(
      "zoom-controls"
    ).style.display = "block";

    requestAnimationFrame(loop);

  } catch (error) {

    console.error(error);

    setStatus(
      "AIまたはカメラの起動に失敗しました"
    );
  }
}


/*
 * ==========================================
 * カメラ開始
 * ==========================================
 */

async function startCamera() {

  if (stream) {

    stream
      .getTracks()
      .forEach(track => track.stop());

    stream = null;
  }

  try {

    stream =
      await navigator.mediaDevices
        .getUserMedia({

          video: {
            facingMode: facingMode,
            width: {
              ideal: 1280
            },
            height: {
              ideal: 720
            }
          },

          audio: false

        });

    video.srcObject = stream;

    await video.play();

    cameraActive = true;

    currentZoom = 1.0;

    updateZoom();

    setStatus(
      "カメラ認識中"
    );

  } catch (error) {

    cameraActive = false;

    console.error(error);

    alert(
      "カメラを起動できませんでした。"
    );
  }
}


/*
 * ==========================================
 * カメラ切替
 * ==========================================
 */

async function switchCamera() {

  if (!cameraActive) {
    return;
  }

  facingMode =
    facingMode === "environment"
      ? "user"
      : "environment";

  await startCamera();
}


/*
 * ==========================================
 * リアルタイム認識
 * ==========================================
 */

async function loop(timestamp) {

  if (
    cameraActive &&
    video &&
    video.readyState >= 2 &&
    model
  ) {

    if (
      timestamp -
      lastPredictionTime >=
      PREDICTION_INTERVAL
    ) {

      lastPredictionTime =
        timestamp;

      try {

        const prediction =
          await model.predict(video);

        showPrediction(
          prediction
        );

      } catch (error) {

        console.error(error);
      }
    }
  }

  if (cameraActive) {
    requestAnimationFrame(loop);
  }
}


/*
 * ==========================================
 * AI結果
 * ==========================================
 */

function showPrediction(prediction) {

  if (!labelContainer) {
    return;
  }

  let highestIndex = 0;

  for (
    let i = 1;
    i < prediction.length;
    i++
  ) {

    if (
      prediction[i].probability >
      prediction[highestIndex].probability
    ) {

      highestIndex = i;
    }
  }

  const highest =
    prediction[highestIndex];

  document.getElementById(
    "highest-result"
  ).style.display = "block";

  document.getElementById(
    "highest-name"
  ).textContent =
    highest.className;

  document.getElementById(
    "highest-percent"
  ).textContent =
    (
      highest.probability * 100
    ).toFixed(1) + "%";


  for (
    let i = 0;
    i < prediction.length;
    i++
  ) {

    const item =
      labelContainer.children[i];

    if (!item) {
      continue;
    }

    const value =
      prediction[i].probability * 100;

    item.querySelector(
      ".result-name"
    ).textContent =
      prediction[i].className;

    item.querySelector(
      ".result-percent"
    ).textContent =
      value.toFixed(1) + "%";

    item.querySelector(
      ".bar"
    ).style.width =
      value + "%";
  }
}


/*
 * ==========================================
 * デジタルズーム
 * ==========================================
 */

function changeZoom(amount) {

  if (!cameraActive || !video) {
    return;
  }

  currentZoom += amount;

  currentZoom =
    Math.max(
      MIN_ZOOM,
      Math.min(
        MAX_ZOOM,
        currentZoom
      )
    );

  updateZoom();
}


function updateZoom() {

  document.getElementById(
    "zoom-value"
  ).textContent =
    currentZoom.toFixed(1) + "×";

  if (video) {

    video.style.transform =
      "scale(" +
      currentZoom +
      ")";
  }
}


/*
 * ==========================================
 * 写真撮影
 * ==========================================
 */

function capturePhoto() {

  if (!cameraActive || !video) {
    return;
  }

  const canvas =
    document.createElement("canvas");

  const width =
    video.videoWidth;

  const height =
    video.videoHeight;

  canvas.width = width;
  canvas.height = height;

  const ctx =
    canvas.getContext("2d");

  ctx.save();

  ctx.translate(
    width / 2,
    height / 2
  );

  ctx.scale(
    currentZoom,
    currentZoom
  );

  ctx.drawImage(
    video,
    -width / 2,
    -height / 2,
    width,
    height
  );

  ctx.restore();

  capturedDataURL =
    canvas.toDataURL(
      "image/jpeg",
      0.92
    );

  showCapturedImage(
    capturedDataURL
  );

  predictImage(canvas);
}


/*
 * ==========================================
 * 画像読み込み
 * ==========================================
 */

function openImagePicker() {

  document.getElementById(
    "image-input"
  ).click();
}


function loadImage(event) {

  const file =
    event.target.files[0];

  if (!file) {
    return;
  }

  /*
   * FileReaderは端末内でファイルを読むだけ。
   *
   * ここでサーバーへのアップロードは行わない。
   */

  const reader =
    new FileReader();

  reader.onload = function(e) {

    capturedDataURL =
      e.target.result;

    showCapturedImage(
      capturedDataURL
    );

    const image =
      new Image();

    image.onload = function() {

      predictImage(image);

    };

    image.src =
      capturedDataURL;
  };

  reader.readAsDataURL(file);

  event.target.value = "";
}


/*
 * ==========================================
 * 画像判定
 * ==========================================
 */

async function predictImage(image) {

  try {

    await loadModel();

    const prediction =
      await model.predict(image);

    showPrediction(
      prediction
    );

    setStatus(
      "画像のAI判定完了"
    );

  } catch (error) {

    console.error(error);

    setStatus(
      "画像の判定に失敗しました"
    );
  }
}


/*
 * ==========================================
 * 写真表示
 * ==========================================
 */

function showCapturedImage(dataURL) {

  document.getElementById(
    "captured-photo"
  ).src = dataURL;

  document.getElementById(
    "photo-area"
  ).style.display = "block";
}


/*
 * ==========================================
 * 写真保存
 * ==========================================
 */

function downloadPhoto() {

  if (!capturedDataURL) {
    return;
  }

  const link =
    document.createElement("a");

  link.href =
    capturedDataURL;

  link.download =
    "image-recognition-photo.jpg";

  link.click();
}


/*
 * ==========================================
 * 写真削除
 * ==========================================
 */

function deletePhoto() {

  capturedDataURL = null;

  document.getElementById(
    "captured-photo"
  ).removeAttribute("src");

  document.getElementById(
    "photo-area"
  ).style.display = "none";

  clearResults();

  setStatus(
    "写真を削除しました"
  );
}


/*
 * ==========================================
 * 結果削除
 * ==========================================
 */

function clearResults() {

  document.getElementById(
    "highest-result"
  ).style.display = "none";

  document.getElementById(
    "highest-name"
  ).textContent = "";

  document.getElementById(
    "highest-percent"
  ).textContent = "";

  if (labelContainer) {

    labelContainer.innerHTML = "";

    if (maxPredictions > 0) {
      createResultArea();
    }
  }
}


/*
 * ==========================================
 * カメラOFF
 * ==========================================
 */

function stopCamera() {

  if (stream) {

    stream
      .getTracks()
      .forEach(track => {

        track.stop();

      });

    stream = null;
  }

  cameraActive = false;

  if (video) {

    video.pause();
    video.srcObject = null;

  }

  video = null;

  /*
   * 一時的な写真データを消去
   */

  capturedDataURL = null;

  document.getElementById(
    "webcam-container"
  ).innerHTML = `
    <div class="camera-message">
      カメラを起動してください
    </div>
  `;

  document.getElementById(
    "start-button"
  ).style.display = "block";

  document.getElementById(
    "switch-button"
  ).style.display = "none";

  document.getElementById(
    "stop-button"
  ).style.display = "none";

  document.getElementById(
    "capture-button"
  ).style.display = "none";

  document.getElementById(
    "zoom-controls"
  ).style.display = "none";

  document.getElementById(
    "photo-area"
  ).style.display = "none";

  document.getElementById(
    "captured-photo"
  ).removeAttribute("src");

  clearResults();

  currentZoom = 1.0;

  setStatus(
    "カメラOFF"
  );
}


/*
 * ==========================================
 * ステータス
 * ==========================================
 */

function setStatus(text) {

  document.getElementById(
    "status"
  ).textContent = text;
}


/*
 * ==========================================
 * ボタン
 * ==========================================
 */

document.getElementById(
  "start-button"
).addEventListener(
  "click",
  init
);

document.getElementById(
  "switch-button"
).addEventListener(
  "click",
  switchCamera
);

document.getElementById(
  "stop-button"
).addEventListener(
  "click",
  stopCamera
);

document.getElementById(
  "capture-button"
).addEventListener(
  "click",
  capturePhoto
);

document.getElementById(
  "zoom-minus"
).addEventListener(
  "click",
  () => changeZoom(-0.5)
);

document.getElementById(
  "zoom-plus"
).addEventListener(
  "click",
  () => changeZoom(0.5)
);

document.getElementById(
  "download-button"
).addEventListener(
  "click",
  downloadPhoto
);

document.getElementById(
  "delete-photo-button"
).addEventListener(
  "click",
  deletePhoto
);

document.getElementById(
  "load-image-button"
).addEventListener(
  "click",
  openImagePicker
);

document.getElementById(
  "image-input"
).addEventListener(
  "change",
  loadImage
);

</script>

</body>
</html>
