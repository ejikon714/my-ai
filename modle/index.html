<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>画像認識AI</title>

  <script src="https://cdn.jsdelivr.net/npm/@teachablemachine/image@0.8/dist/teachablemachine-image.min.js"></script>

  <style>
    * {

    body {
      margin: 0;
      min-height: 100vh;
      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        sans-serif;

    .card {
      background: white;

      display: none;

    #zoom-controls {
      display: none;

    }
  </style>
</head>

<body>

<div class="app">

  <div class="header">
    <h1>画像認識AI</h1>
    <div class="subtitle">
      カメラで画像を認識します
    </div>
  </div>

  <div class="card">

    <div id="webcam-container">
      <div class="camera-message">
        カメラを起動してください
      </div>
    </div>

    <div class="buttons">

      <button
        id="start-button"
        type="button"
        onclick="init()">
        📷 カメラを起動
      </button>

      <button
        id="switch-button"
        type="button"
        onclick="switchCamera()">
        🔄 カメラ切り替え
      </button>

      <button
        id="stop-button"
        type="button"
        onclick="stopCamera()">
        ⛔ カメラOFF
      </button>

      <button
        id="capture-button"
        type="button"
        onclick="capturePhoto()">
        📸 写真を撮影
      </button>

    </div>

    <div id="zoom-controls">

      <div class="zoom-title">
        デジタルズーム
      </div>

      <div class="zoom-buttons">

        <button
          class="zoom-button"
          onclick="changeZoom(-0.5)">
          −
        </button>

        <div id="zoom-value">
          1.0×
        </div>

        <button
          class="zoom-button"
          onclick="changeZoom(0.5)">
          ＋
        </button>

      </div>

    </div>

    <div id="photo-area">

      <img
        id="captured-photo"
        alt="撮影した写真">

      <button
        id="download-button"
        onclick="downloadPhoto()">
        💾 写真を保存
      </button>

      <div class="privacy">
        🔒 この写真はこのページ内だけで処理されます。
        AIから外部サーバーへ写真を送信する処理はありません。
      </div>

    </div>

  </div>


  <div class="card">

    <div class="result-title">
      認識結果
    </div>

    <div id="highest-result">

      <div class="highest-label">
        最も高い認識結果
      </div>

      <div id="highest-name"></div>

      <div id="highest-percent"></div>

    </div>

    <div id="label-container"></div>

  </div>


  <div class="footer">
    Image Recognition AI
  </div>

</div>


<script>

const URL = "./";

let model = null;
let video = null;
let stream = null;
let labelContainer = null;
let maxPredictions = 0;

let cameraActive = false;

let facingMode = "environment";

let currentZoom = 1.0;

const MIN_ZOOM = 1.0;
const MAX_ZOOM = 3.0;


/*
  撮影した写真を一時的に保持
  外部へ送信しない
*/
let capturedDataURL = null;


/*
  =========================
  AI起動
  =========================
*/

async function init() {

  try {

    if (!model) {

      model = await tmImage.load(
        URL + "model.json",
        URL + "metadata.json"
      );

      maxPredictions =
        model.getTotalClasses();
    }


    video =
      document.createElement("video");

    video.id = "webcam";
    video.autoplay = true;
    video.playsInline = true;
    video.muted = true;


    const container =
      document.getElementById(
        "webcam-container"
      );

    container.innerHTML = "";
    container.appendChild(video);


    labelContainer =
      document.getElementById(
        "label-container"
      );

    labelContainer.innerHTML = "";


    for (
      let i = 0;
      i < maxPredictions;
      i++
    ) {

      const item =
        document.createElement("div");

      item.className =
        "result-item";

      item.innerHTML = `
        <div class="result-header">
          <span class="result-name"></span>
          <span class="result-percent"></span>
        </div>

        <div class="bar-background">
          <div class="bar"></div>
        </div>
      `;

      labelContainer.appendChild(item);
    }


    await startCamera();


    if (!cameraActive) {
      return;
    }


    document.getElementById(
      "start-button"
    ).style.display = "none";


    document.getElementById(
      "switch-button"
    ).style.display = "block";


    document.getElementById(
      "stop-button"
    ).style.display = "block";


    document.getElementById(
      "capture-button"
    ).style.display = "block";


    document.getElementById(
      "zoom-controls"
    ).style.display = "block";


    document.getElementById(
      "photo-area"
    ).style.display = "none";


    currentZoom = 1.0;
    updateZoom();


    requestAnimationFrame(loop);

  } catch (error) {

    console.error(error);

    alert(
      "AIまたはカメラの起動に失敗しました。"
    );
  }
}


/*
  =========================
  カメラ開始
  =========================
*/

async function startCamera() {

  if (stream) {

    stream
      .getTracks()
      .forEach(track => track.stop());

    stream = null;
  }


  try {

    stream =
      await navigator
        .mediaDevices
        .getUserMedia({

          video: {
            facingMode: facingMode,
            width: {
              ideal: 1280
            },
            height: {
              ideal: 720
            }
          },

          audio: false

        });


    video.srcObject = stream;

    await video.play();

    cameraActive = true;

    currentZoom = 1.0;

    updateZoom();

  } catch (error) {

    console.error(error);

    cameraActive = false;

    alert(
      "カメラを起動できませんでした。"
    );
  }
}


/*
  =========================
  前後カメラ
  =========================
*/

async function switchCamera() {

  if (!cameraActive) {
    return;
  }


  facingMode =
    facingMode === "environment"
      ? "user"
      : "environment";


  await startCamera();
}


/*
  =========================
  写真撮影
  =========================
*/

function capturePhoto() {

  if (
    !cameraActive ||
    !video
  ) {
    return;
  }


  /*
    Canvasをブラウザ内だけで作成
  */

  const canvas =
    document.createElement("canvas");


  const width =
    video.videoWidth || 640;

  const height =
    video.videoHeight || 480;


  canvas.width = width;
  canvas.height = height;


  const ctx =
    canvas.getContext("2d");


  /*
    デジタルズームを
    撮影画像にも反映
  */

  ctx.save();

  ctx.translate(
    width / 2,
    height / 2
  );

  ctx.scale(
    currentZoom,
    currentZoom
  );

  ctx.drawImage(
    video,
    -width / 2,
    -height / 2,
    width,
    height
  );

  ctx.restore();


  /*
    Canvasから画像を作る。
    この処理はブラウザ内だけ。
  */

  capturedDataURL =
    canvas.toDataURL(
      "image/jpeg",
      0.92
    );


  /*
    撮影画像を画面に表示
  */

  const photo =
    document.getElementById(
      "captured-photo"
    );

  photo.src =
    capturedDataURL;


  document.getElementById(
    "photo-area"
  ).style.display = "block";


  /*
    撮影時点の画像をAIでも判定
  */

  predictPhoto(canvas);
}


/*
  =========================
  撮影画像のAI認識
  =========================
*/

async function predictPhoto(canvas) {

  if (!model) {
    return;
  }


  try {

    const prediction =
      await model.predict(canvas);


    showPrediction(prediction);

  } catch (error) {

    console.error(error);

  }
}


/*
  =========================
  認識結果表示
  =========================
*/

function showPrediction(prediction) {

  if (!labelContainer) {
    return;
  }


  let highestIndex = 0;

  let highestProbability =
    prediction[0].probability;


  for (
    let i = 1;
    i < prediction.length;
    i++
  ) {

    if (
      prediction[i].probability >
      highestProbability
    ) {

      highestProbability =
        prediction[i].probability;

      highestIndex = i;
    }
  }


  const highest =
    prediction[highestIndex];


  document.getElementById(
    "highest-result"
  ).style.display = "block";


  document.getElementById(
    "highest-name"
  ).textContent =
    highest.className;


  document.getElementById(
    "highest-percent"
  ).textContent =
    (
      highest.probability * 100
    ).toFixed(1) + "%";


  for (
    let i = 0;
    i < prediction.length;
    i++
  ) {

    const item =
      labelContainer.children[i];

    if (!item) {
      continue;
    }


    const value =
      prediction[i].probability * 100;


    item.querySelector(
      ".result-name"
    ).textContent =
      prediction[i].className;


    item.querySelector(
      ".result-percent"
    ).textContent =
      value.toFixed(1) + "%";


    item.querySelector(
      ".bar"
    ).style.width =
      value + "%";
  }
}


/*
  =========================
  リアルタイム認識
  =========================
*/

async function loop() {

  if (
    cameraActive &&
    video &&
    video.readyState >= 2 &&
    model
  ) {

    try {

      const prediction =
        await model.predict(video);

      showPrediction(prediction);

    } catch (error) {

      console.error(error);

    }
  }


  if (cameraActive) {

    requestAnimationFrame(loop);
  }
}


/*
  =========================
  ズーム
  =========================
*/

function changeZoom(amount) {

  if (
    !cameraActive ||
    !video
  ) {
    return;
  }


  currentZoom += amount;


  currentZoom =
    Math.max(
      MIN_ZOOM,
      Math.min(
        MAX_ZOOM,
        currentZoom
      )
    );


  updateZoom();
}


function updateZoom() {

  const zoomValue =
    document.getElementById(
      "zoom-value"
    );


  if (zoomValue) {

    zoomValue.textContent =
      currentZoom.toFixed(1) + "×";
  }


  if (video) {

    video.style.transform =
      "scale(" +
      currentZoom +
      ")";
  }
}


/*
  =========================
  写真保存
  =========================
*/

function downloadPhoto() {

  if (!capturedDataURL) {
    return;
  }


  const link =
    document.createElement("a");


  link.href =
    capturedDataURL;


  link.download =
    "image-recognition-photo.jpg";


  /*
    ブラウザの保存機能を使用。
    サーバーへアップロードしない。
  */

  link.click();
}


/*
  =========================
  カメラOFF
  =========================

  ★撮影画像も消去
  ★認識結果も消去
  ★最初の画面へ戻る
  =========================
*/

function stopCamera() {

  if (stream) {

    stream
      .getTracks()
      .forEach(track => {
        track.stop();
      });

    stream = null;
  }


  cameraActive = false;


  if (video) {

    video.pause();

    video.srcObject = null;
  }


  video = null;


  /*
    撮影画像をメモリから消す
  */

  capturedDataURL = null;


  /*
    カメラ画面を初期状態へ
  */

  document.getElementById(
    "webcam-container"
  ).innerHTML = `
    <div class="camera-message">
      カメラを起動してください
    </div>
  `;


  /*
    ボタンを初期状態へ
  */

  document.getElementById(
    "start-button"
  ).style.display = "block";


  document.getElementById(
    "switch-button"
  ).style.display = "none";


  document.getElementById(
    "stop-button"
  ).style.display = "none";


  document.getElementById(
    "capture-button"
  ).style.display = "none";


  document.getElementById(
    "zoom-controls"
  ).style.display = "none";


  /*
    撮影画像を画面から消す
  */

  document.getElementById(
    "photo-area"
  ).style.display = "none";


  document.getElementById(
    "captured-photo"
  ).removeAttribute("src");


  /*
    最も高い認識結果を消す
  */

  document.getElementById(
    "highest-result"
  ).style.display = "none";


  document.getElementById(
    "highest-name"
  ).textContent = "";


  document.getElementById(
    "highest-percent"
  ).textContent = "";


  /*
    全認識結果を消す
  */

  if (labelContainer) {

    labelContainer.innerHTML = "";
  }


  labelContainer = null;


  /*
    ズーム初期化
  */

  currentZoom = 1.0;
}

</script>

</body>
</html>
