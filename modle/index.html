  <style>

<body>

  <div class="app">

    <div class="header">

      <h1>画像認識AI</h1>

      <div class="subtitle">
        カメラで画像を認識します
      </div>

    </div>


    <div class="camera-card">

      <div id="webcam-container">

        <div class="camera-message">
          カメラを起動してください
        </div>

      </div>


      <div class="buttons">

        <button
          id="start-button"
          type="button"
          onclick="init()">
          カメラを起動
        </button>


        <button
          id="switch-button"
          type="button"
          onclick="switchCamera()">
          カメラ切り替え
        </button>


        <button
          id="stop-button"
          type="button"
          onclick="stopCamera()">
          カメラをオフ
        </button>

      </div>


      <!-- デジタルズーム -->

      <div id="zoom-controls">

        <div class="zoom-title">
          デジタルズーム
        </div>

        <div class="zoom-buttons">

          <button
            class="zoom-button"
            type="button"
            onclick="changeZoom(-0.5)">
            −
          </button>

          <div id="zoom-value">
            1.0×
          </div>

          <button
            class="zoom-button"
            type="button"
            onclick="changeZoom(0.5)">
            ＋
          </button>

        </div>

      </div>

    </div>


    <div class="result-card">

      <div class="result-title">
        認識結果
      </div>

      <div id="label-container"></div>

    </div>


    <div class="footer">
      Image Recognition AI
    </div>

  </div>


  <script>

    const URL = "./";

    let model = null;
    let video = null;
    let stream = null;

    let labelContainer = null;
    let maxPredictions = 0;

    // 最初は背面カメラ
    let facingMode = "environment";

    // カメラ状態
    let cameraActive = false;

    // デジタルズーム
    let currentZoom = 1.0;

    const MIN_ZOOM = 1.0;
    const MAX_ZOOM = 3.0;
    const ZOOM_STEP = 0.5;


    // =====================================
    // AIモデル読み込み + カメラ起動
    // =====================================

    async function init() {

      try {

        // AIモデルを最初の1回だけ読み込む
        if (!model) {

          const modelURL =
            URL + "model.json";

          const metadataURL =
            URL + "metadata.json";

          model =
            await tmImage.load(
              modelURL,
              metadataURL
            );

          maxPredictions =
            model.getTotalClasses();

        }


        // ビデオ作成
        video =
          document.createElement("video");

        video.id = "webcam";

        video.autoplay = true;
        video.playsInline = true;
        video.muted = true;


        const container =
          document.getElementById(
            "webcam-container"
          );


        container.innerHTML = "";

        container.appendChild(video);


        // 認識結果欄
        labelContainer =
          document.getElementById(
            "label-container"
          );

        labelContainer.innerHTML = "";


        for (
          let i = 0;
          i < maxPredictions;
          i++
        ) {

          labelContainer.appendChild(
            document.createElement("div")
          );

        }


        // ズームを1倍に戻す
        currentZoom = 1.0;

        updateZoomDisplay();


        // カメラ開始
        await startCamera();


        if (!cameraActive) {
          return;
        }


        // ボタン表示
        document.getElementById(
          "start-button"
        ).style.display = "none";


        document.getElementById(
          "switch-button"
        ).style.display = "block";


        document.getElementById(
          "stop-button"
        ).style.display = "block";


        // ズームボタン表示
        document.getElementById(
          "zoom-controls"
        ).style.display = "block";


        // AI認識開始
        window.requestAnimationFrame(
          loop
        );

      } catch (error) {

        console.error(error);

        alert(
          "カメラまたはAIの起動に失敗しました。"
        );

      }

    }


    // =====================================
    // カメラ開始
    // =====================================

    async function startCamera() {

      // 既存のカメラを停止
      if (stream) {

        stream
          .getTracks()
          .forEach(
            track => track.stop()
          );

        stream = null;

      }


      const constraints = {

        video: {

          facingMode:
            facingMode,

          width: {
            ideal: 1280
          },

          height: {
            ideal: 720
          }

        },

        audio: false

      };


      try {

        stream =
          await navigator
            .mediaDevices
            .getUserMedia(
              constraints
            );


        video.srcObject =
          stream;


        await video.play();


        cameraActive = true;


        // カメラ切り替え時にズームをリセット
        currentZoom = 1.0;

        updateZoomDisplay();


      } catch (error) {

        console.error(error);

        cameraActive = false;


        alert(
          "カメラを起動できませんでした。カメラの使用を許可してください。"
        );

      }

    }


    // =====================================
    // カメラ切り替え
    // =====================================

    async function switchCamera() {

      if (!cameraActive) {
        return;
      }


      if (
        facingMode ===
        "environment"
      ) {

        facingMode = "user";

      } else {

        facingMode =
          "environment";

      }


      await startCamera();

    }


    // =====================================
    // カメラOFF
    // =====================================

    function stopCamera() {

      // カメラ停止
      if (stream) {

        stream
          .getTracks()
          .forEach(
            track => track.stop()
          );

        stream = null;

      }


      cameraActive = false;


      // ズームを初期化
      currentZoom = 1.0;


      // カメラ画面を変更
      const container =
        document.getElementById(
          "webcam-container"
        );


      container.innerHTML = `

        <div class="camera-message">
          カメラはオフです
        </div>

      `;


      // ボタン表示
      document.getElementById(
        "start-button"
      ).style.display = "block";


      document.getElementById(
        "switch-button"
      ).style.display = "none";


      document.getElementById(
        "stop-button"
      ).style.display = "none";


      // ズームを非表示
      document.getElementById(
        "zoom-controls"
      ).style.display = "none";


      // 認識結果を削除
      if (labelContainer) {

        labelContainer.innerHTML = "";

      }

    }


    // =====================================
    // デジタルズーム変更
    // =====================================

    function changeZoom(amount) {

      if (!cameraActive || !video) {
        return;
      }


      currentZoom += amount;


      // 1.0～3.0倍の範囲にする
      currentZoom =
        Math.max(
          MIN_ZOOM,
          Math.min(
            MAX_ZOOM,
            currentZoom
          )
        );


      updateZoomDisplay();

    }


    // =====================================
    // ズーム表示更新
    // =====================================

    function updateZoomDisplay() {

      const zoomValue =
        document.getElementById(
          "zoom-value"
        );


      if (zoomValue) {

        zoomValue.textContent =
          currentZoom.toFixed(1) +
          "×";

      }


      // 実際の映像を拡大
      if (video) {

        video.style.transform =
          "scale(" +
          currentZoom +
          ")";

      }

    }


    // =====================================
    // AI認識ループ
    // =====================================

    async function loop() {

      if (
        cameraActive &&
        video &&
        video.readyState >= 2 &&
        model
      ) {

        await predict();

      }


      // カメラONの間だけループ
      if (cameraActive) {

        window.requestAnimationFrame(
          loop
        );

      }

    }


    // =====================================
    // AI予測
    // =====================================

    async function predict() {

      if (
        !cameraActive ||
        !video ||
        !model
      ) {

        return;

      }


      try {

        const prediction =
          await model.predict(
            video
          );


        for (
          let i = 0;
          i < maxPredictions;
          i++
        ) {

          const className =
            prediction[i]
              .className;


          const probability =
            (
              prediction[i]
                .probability *
              100
            ).toFixed(1);


          if (
            labelContainer &&
            labelContainer.childNodes[i]
          ) {

            labelContainer
              .childNodes[i]
              .innerHTML =
                className +
                "　" +
                probability +
                "%";

          }

        }

      } catch (error) {

        console.error(error);

      }

    }

  </script>

</body>
</html>
