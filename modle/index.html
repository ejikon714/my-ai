  <style>

    #highest-result {

    @media (max-width: 360px) {
      .app {
        padding-left: 12px;
        padding-right: 12px;
      }

      h1 {
        font-size: 26px;
      }

        font-size: 13px;

  </style>
</head>

<body>

  <div class="app">

    <div class="header">
      <h1>画像認識AI</h1>

      <div class="subtitle">
        カメラで画像を認識します
      </div>
    </div>


    <div class="card">

      <div id="webcam-container">
        <div class="camera-message">
          カメラを起動してください
        </div>
      </div>


      <div class="buttons">

        <button
          id="start-button"
          type="button"
          onclick="init()">
          カメラを起動
        </button>

        <button
          id="switch-button"
          type="button"
          onclick="switchCamera()">
          🔄 カメラ切り替え
        </button>

        <button
          id="stop-button"
          type="button"
          onclick="stopCamera()">
          ⛔ カメラOFF
        </button>

      </div>


      <div id="zoom-controls">

        <div class="zoom-title">
          デジタルズーム
        </div>

        <div class="zoom-buttons">

          <button
            class="zoom-button"
            type="button"
            onclick="changeZoom(-0.5)">
            −
          </button>

          <div id="zoom-value">
            1.0×
          </div>

          <button
            class="zoom-button"
            type="button"
            onclick="changeZoom(0.5)">
            ＋
          </button>

        </div>

      </div>

    </div>


    <div class="card">

      <div class="result-title">
        認識結果
      </div>


      <!--
        カメラOFF時はこの部分も完全に非表示
      -->

      <div id="highest-result">

        <div class="highest-label">
          最も高い認識結果
        </div>

        <div id="highest-name"></div>

        <div id="highest-percent"></div>

      </div>


      <div id="label-container"></div>

    </div>


    <div class="footer">
      Image Recognition AI
    </div>

  </div>


  <script>

    /*
      =========================
      基本設定
      =========================
    */

    const URL = "./";

    let model = null;

    let video = null;

    let stream = null;

    let labelContainer = null;

    let maxPredictions = 0;

    let cameraActive = false;

    /*
      最初は背面カメラ
    */
    let facingMode = "environment";

    /*
      デジタルズーム
    */
    let currentZoom = 1.0;

    const MIN_ZOOM = 1.0;

    const MAX_ZOOM = 3.0;

    const ZOOM_STEP = 0.5;


    /*
      =========================
      AI・カメラ起動
      =========================
    */

    async function init() {

      try {

        /*
          AIモデルを読み込む
        */

        if (!model) {

          const modelURL =
            URL + "model.json";

          const metadataURL =
            URL + "metadata.json";

          model =
            await tmImage.load(
              modelURL,
              metadataURL
            );

          maxPredictions =
            model.getTotalClasses();
        }


        /*
          videoを作成
        */

        video =
          document.createElement("video");

        video.id = "webcam";

        video.autoplay = true;

        video.playsInline = true;

        video.muted = true;


        /*
          カメラ画面を入れ替える
        */

        const container =
          document.getElementById(
            "webcam-container"
          );

        container.innerHTML = "";

        container.appendChild(video);


        /*
          認識結果欄を作る
        */

        labelContainer =
          document.getElementById(
            "label-container"
          );

        labelContainer.innerHTML = "";


        for (
          let i = 0;
          i < maxPredictions;
          i++
        ) {

          const item =
            document.createElement("div");

          item.className =
            "result-item";


          item.innerHTML = `

            <div class="result-header">

              <span class="result-name">
              </span>

              <span class="result-percent">
              </span>

            </div>

            <div class="bar-background">

              <div class="bar">
              </div>

            </div>

          `;


          labelContainer.appendChild(item);
        }


        /*
          カメラ開始
        */

        await startCamera();


        if (!cameraActive) {

          return;

        }


        /*
          ボタン表示
        */

        document.getElementById(
          "start-button"
        ).style.display = "none";


        document.getElementById(
          "switch-button"
        ).style.display = "block";


        document.getElementById(
          "stop-button"
        ).style.display = "block";


        document.getElementById(
          "zoom-controls"
        ).style.display = "block";


        /*
          ズーム初期化
        */

        currentZoom = 1.0;

        updateZoom();


        /*
          認識開始
        */

        requestAnimationFrame(loop);


      } catch (error) {

        console.error(error);

        alert(
          "AIまたはカメラの起動に失敗しました。"
        );

      }

    }


    /*
      =========================
      カメラ開始
      =========================
    */

    async function startCamera() {

      /*
        既存カメラを停止
      */

      if (stream) {

        stream
          .getTracks()
          .forEach(track => {
            track.stop();
          });

        stream = null;

      }


      const constraints = {

        video: {

          facingMode: facingMode,

          width: {
            ideal: 1280
          },

          height: {
            ideal: 720
          }

        },

        audio: false

      };


      try {

        stream =
          await navigator
            .mediaDevices
            .getUserMedia(
              constraints
            );


        video.srcObject =
          stream;


        await video.play();


        cameraActive = true;


        currentZoom = 1.0;


        updateZoom();


      } catch (error) {

        console.error(error);


        cameraActive = false;


        alert(
          "カメラを起動できませんでした。\n\nブラウザのカメラ使用許可を確認してください。"
        );

      }

    }


    /*
      =========================
      前後カメラ切り替え
      =========================
    */

    async function switchCamera() {

      if (!cameraActive) {

        return;

      }


      if (
        facingMode === "environment"
      ) {

        facingMode = "user";

      } else {

        facingMode = "environment";

      }


      await startCamera();

    }


    /*
      =========================
      カメラOFF
      =========================

      ★ここが重要

      カメラOFF時に、

      ・カメラ映像
      ・ズーム
      ・最も高い認識結果
      ・認識率
      ・認識率バー
      ・カメラ切り替えボタン

      をすべて消して、

      最初の画面に戻す。
      =========================
    */

    function stopCamera() {

      /*
        カメラを完全停止
      */

      if (stream) {

        stream
          .getTracks()
          .forEach(track => {
            track.stop();
          });

        stream = null;

      }


      cameraActive = false;


      /*
        videoを停止
      */

      if (video) {

        video.pause();

        video.srcObject = null;

      }


      video = null;


      /*
        ズームを初期値へ
      */

      currentZoom = 1.0;


      /*
        カメラ画面を
        最初の状態へ戻す
      */

      const container =
        document.getElementById(
          "webcam-container"
        );


      container.innerHTML = `

        <div class="camera-message">
          カメラを起動してください
        </div>

      `;


      /*
        起動ボタンだけ表示
      */

      document.getElementById(
        "start-button"
      ).style.display = "block";


      document.getElementById(
        "switch-button"
      ).style.display = "none";


      document.getElementById(
        "stop-button"
      ).style.display = "none";


      /*
        ズームを完全に非表示
      */

      document.getElementById(
        "zoom-controls"
      ).style.display = "none";


      /*
        ======================
        最も高い認識結果を消す
        ======================
      */

      const highestResult =
        document.getElementById(
          "highest-result"
        );


      if (highestResult) {

        highestResult.style.display =
          "none";

      }


      /*
        名前を消す
      */

      const highestName =
        document.getElementById(
          "highest-name"
        );


      if (highestName) {

        highestName.textContent = "";

      }


      /*
        認識率を消す
      */

      const highestPercent =
        document.getElementById(
          "highest-percent"
        );


      if (highestPercent) {

        highestPercent.textContent = "";

      }


      /*
        ======================
        全認識結果を消す
        ======================
      */

      if (labelContainer) {

        labelContainer.innerHTML = "";

      }


      labelContainer = null;

    }


    /*
      =========================
      デジタルズーム変更
      =========================
    */

    function changeZoom(amount) {

      if (
        !cameraActive ||
        !video
      ) {

        return;

      }


      currentZoom += amount;


      /*
        1.0～3.0倍に制限
      */

      currentZoom =
        Math.max(
          MIN_ZOOM,
          Math.min(
            MAX_ZOOM,
            currentZoom
          )
        );


      updateZoom();

    }


    /*
      =========================
      ズーム表示更新
      =========================
    */

    function updateZoom() {

      const zoomValue =
        document.getElementById(
          "zoom-value"
        );


      if (zoomValue) {

        zoomValue.textContent =
          currentZoom.toFixed(1) +
          "×";

      }


      if (video) {

        video.style.transform =
          "scale(" +
          currentZoom +
          ")";

      }

    }


    /*
      =========================
      AI認識ループ
      =========================
    */

    async function loop() {

      /*
        カメラがONのときだけ認識
      */

      if (
        cameraActive &&
        video &&
        video.readyState >= 2 &&
        model
      ) {

        await predict();

      }


      /*
        カメラがONなら続ける

        OFFになったらここで停止
      */

      if (cameraActive) {

        requestAnimationFrame(loop);

      }

    }


    /*
      =========================
      AI認識
      =========================
    */

    async function predict() {

      /*
        OFFなら何もしない
      */

      if (
        !cameraActive ||
        !video ||
        !model ||
        !labelContainer
      ) {

        return;

      }


      try {

        const prediction =
          await model.predict(video);


        /*
          ======================
          最も高い認識結果を探す
          ======================
        */

        let highestIndex = 0;

        let highestProbability =
          prediction[0].probability;


        for (
          let i = 1;
          i < maxPredictions;
          i++
        ) {

          if (
            prediction[i].probability >
            highestProbability
          ) {

            highestProbability =
              prediction[i].probability;

            highestIndex = i;

          }

        }


        const highest =
          prediction[highestIndex];


        /*
          最も高い認識結果を表示
        */

        const highestResult =
          document.getElementById(
            "highest-result"
          );


        if (highestResult) {

          highestResult.style.display =
            "block";

        }


        document.getElementById(
          "highest-name"
        ).textContent =
          highest.className;


        document.getElementById(
          "highest-percent"
        ).textContent =
          (
            highest.probability * 100
          ).toFixed(1) + "%";


        /*
          ======================
          全認識結果
          ======================
        */

        for (
          let i = 0;
          i < maxPredictions;
          i++
        ) {

          const item =
            labelContainer.children[i];


          if (!item) {

            continue;

          }


          const name =
            item.querySelector(
              ".result-name"
            );


          const percent =
            item.querySelector(
              ".result-percent"
            );


          const bar =
            item.querySelector(
              ".bar"
            );


          const value =
            prediction[i].probability *
            100;


          name.textContent =
            prediction[i].className;


          percent.textContent =
            value.toFixed(1) + "%";


          bar.style.width =
            value + "%";

        }

      } catch (error) {

        /*
          カメラOFF直後などのエラーは
          コンソールだけに表示
        */

        console.error(error);

      }

    }

  </script>

</body>
</html>
