<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>画像認識AI</title>

  <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@4.22.0"></script>
  <script src="https://cdn.jsdelivr.net/npm/@teachablemachine/image@0.8/dist/teachablemachine-image.min.js"></script>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        sans-serif;

      margin: 0;
      min-height: 100vh;

      background:
        linear-gradient(
          135deg,
          #eef2ff,
          #f8fafc
        );

      color: #1e293b;
    }

    .app {
      width: 100%;
      max-width: 480px;
      margin: 0 auto;
      padding: 30px 18px 35px;
    }

    /* ヘッダー */

    .header {
      text-align: center;
      margin-bottom: 25px;
    }

    h1 {
      margin: 0;
      font-size: 30px;
      font-weight: 800;
      letter-spacing: 1px;
    }

    .subtitle {
      margin-top: 8px;
      color: #64748b;
      font-size: 14px;
    }

    /* カメラカード */

    .camera-card {
      background: white;

      border-radius: 25px;

      padding: 15px;

      box-shadow:
        0 12px 35px rgba(0, 0, 0, 0.10);

      margin-bottom: 20px;
    }

    #webcam-container {
      width: 100%;
      aspect-ratio: 1 / 1;

      background: #0f172a;

      border-radius: 18px;

      overflow: hidden;

      display: flex;
      align-items: center;
      justify-content: center;
    }

    #webcam {
      width: 100%;
      height: 100%;

      object-fit: cover;
    }

    .camera-message {
      color: #94a3b8;
      font-size: 14px;
    }

    /* ボタン */

    .buttons {
      display: flex;
      gap: 10px;
      margin-top: 15px;
    }

    button {
      flex: 1;

      border: none;

      padding: 15px 10px;

      border-radius: 15px;

      font-size: 16px;
      font-weight: 700;

      cursor: pointer;

      transition:
        transform 0.15s,
        opacity 0.15s;
    }

    button:active {
      transform: scale(0.96);
    }

    #start-button {
      background: #2563eb;
      color: white;
    }

    #switch-button {
      background: #e2e8f0;
      color: #334155;

      display: none;
    }

    /* 認識結果 */

    .result-card {
      background: white;

      border-radius: 25px;

      padding: 20px;

      box-shadow:
        0 12px 35px rgba(0, 0, 0, 0.08);
    }

    .result-title {
      font-size: 18px;
      font-weight: 800;

      margin-bottom: 15px;
    }

    #label-container div {
      background: #f1f5f9;

      border-radius: 12px;

      padding: 12px 15px;

      margin-bottom: 8px;

      font-size: 16px;
      font-weight: 700;
    }

    /* フッター */

    .footer {
      text-align: center;

      margin-top: 20px;

      color: #94a3b8;

      font-size: 12px;
    }
  </style>
</head>

<body>

  <div class="app">

    <!-- ヘッダー -->

    <div class="header">

      <h1>画像認識AI</h1>

      <div class="subtitle">
        カメラで画像を認識します
      </div>

    </div>


    <!-- カメラ -->

    <div class="camera-card">

      <div id="webcam-container">

        <div class="camera-message">
          カメラを起動してください
        </div>

      </div>

      <div class="buttons">

        <button
          id="start-button"
          type="button"
          onclick="init()">

          カメラを起動

        </button>

        <button
          id="switch-button"
          type="button"
          onclick="switchCamera()">

          カメラを切り替え

        </button>

      </div>

    </div>


    <!-- 認識結果 -->

    <div class="result-card">

      <div class="result-title">
        認識結果
      </div>

      <div id="label-container"></div>

    </div>


    <div class="footer">
      Image Recognition AI
    </div>

  </div>


  <script>

    const URL = "./";

    let model;
    let video;
    let stream = null;

    let labelContainer;
    let maxPredictions;

    // 最初は背面カメラ
    let facingMode = "environment";

    let cameraStarted = false;


    async function init() {

      // AIモデル読み込み

      const modelURL =
        URL + "model.json";

      const metadataURL =
        URL + "metadata.json";

      model =
        await tmImage.load(
          modelURL,
          metadataURL
        );

      maxPredictions =
        model.getTotalClasses();


      // video作成

      video =
        document.createElement("video");

      video.id = "webcam";

      video.autoplay = true;
      video.playsInline = true;
      video.muted = true;


      document
        .getElementById(
          "webcam-container"
        )
        .innerHTML = "";

      document
        .getElementById(
          "webcam-container"
        )
        .appendChild(video);


      // 認識結果

      labelContainer =
        document.getElementById(
          "label-container"
        );

      labelContainer.innerHTML = "";


      for (
        let i = 0;
        i < maxPredictions;
        i++
      ) {

        labelContainer.appendChild(
          document.createElement("div")
        );

      }


      await startCamera();


      document.getElementById(
        "switch-button"
      ).style.display =
        "block";


      document.getElementById(
        "start-button"
      ).textContent =
        "カメラ起動中";


      cameraStarted = true;

    }


    async function startCamera() {

      // 前のカメラを停止

      if (stream) {

        stream
          .getTracks()
          .forEach(
            track =>
              track.stop()
          );

        stream = null;

      }


      const constraints = {

        video: {

          facingMode:
            facingMode,

          width: {
            ideal: 640
          },

          height: {
            ideal: 480
          }

        },

        audio: false

      };


      try {

        stream =
          await navigator
            .mediaDevices
            .getUserMedia(
              constraints
            );

        video.srcObject =
          stream;

        await video.play();


      } catch (error) {

        console.error(error);

        alert(
          "カメラを起動できませんでした。カメラの使用を許可してください。"
        );

        return;

      }


      if (!cameraStarted) {

        window.requestAnimationFrame(
          loop
        );

      }

    }


    async function switchCamera() {

      if (!stream) {
        return;
      }


      if (
        facingMode ===
        "environment"
      ) {

        facingMode = "user";

      } else {

        facingMode =
          "environment";

      }


      await startCamera();

    }


    async function loop() {

      if (
        video &&
        video.readyState >= 2 &&
        model
      ) {

        await predict();

      }

      window.requestAnimationFrame(
        loop
      );

    }


    async function predict() {

      try {

        const prediction =
          await model.predict(
            video
          );


        for (
          let i = 0;
          i < maxPredictions;
          i++
        ) {

          const className =
            prediction[i]
              .className;

          const probability =
            (
              prediction[i]
                .probability *
              100
            ).toFixed(1);


          labelContainer
            .childNodes[i]
            .innerHTML =

              className +
              "　" +
              probability +
              "%";

        }

      } catch (error) {

        console.error(error);

      }

    }

  </script>

</body>
</html>
